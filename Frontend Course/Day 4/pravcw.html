<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Card with Status Indicator</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f6f9;
    font-family: Arial, sans-serif;
  }

  .profile-card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    width: 280px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  /* Relative parent for absolute positioning */
  .avatar-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
  }

  .avatar-wrapper img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* Status indicator */
  .status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    background: #22c55e;
    border: 3px solid white;
    border-radius: 50%;
  }

  h3 {
    margin-bottom: 6px;
    color: #222;
  }

  p {
    color: #666;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="profile-card">
  <div class="avatar-wrapper">
    <img src="https://pravatar.cc/80?img=12" alt="Avatar">
    <span class="status-dot"></span>
  </div>

  <h3>Sneha Patel</h3>
  <p>Full Stack Developer</p>
</div>

</body>
</html>
