<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration Form</title>
</head>
<body>

<center>

    <h1><i>College Event Registration Form</i></h1>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your full name">
        <br><br>

        <label>Email ID:</label>
        <input type="email" placeholder="example@gmail.com">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" placeholder="+91">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Select Your Branch:</label>
        <select>
            <option>Select Branch</option>
            <option>Computer Science Engineering</option>
            <option>Information Technology</option>
            <option>Electronics & Communication</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
        </select>

        <br><br>

        <p><i>Select your current pursuing year:</i></p>

        <input type="radio" name="year"> First Year
        <input type="radio" name="year"> Second Year
        <input type="radio" name="year"> Third Year
        <input type="radio" name="year"> Fourth Year

        <br><br><br>

        <p><i>Events to attend:</i></p>

        <input type="checkbox"> Hackathon <br>
        <input type="checkbox"> Photography Contest <br>
        <input type="checkbox"> Quiz Competition <br>
        <input type="checkbox"> Sports Tournament <br>
        <input type="checkbox"> Technical Workshop <br>

        <br><br>

        <p><i>How did you hear about us?</i></p>

        <textarea rows="4" cols="30" placeholder="Give your answer"></textarea>

        <br><br>

        <input type="submit" value="SUBMIT">

    </form>

</center>

</body>
</html>
