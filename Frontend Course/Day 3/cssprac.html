<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>

    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Welcome to My Web Page</h1>

    <h2>About This Page</h2>
    <p>
        This page demonstrates basic CSS styling using an external stylesheet.
    </p>

    <h2>Why Use External CSS?</h2>
    <p>
        External CSS keeps styling separate from HTML, making code cleaner and
        easier to maintain.
    </p>

</body>
</html>
