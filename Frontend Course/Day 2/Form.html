<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    
    <h1>College Event Registration</h1>
    <form action="text">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name.." required>
        <br>
         <br>
        <label for="Email">Email:</label>
        <input type="email" id="email" name="email" placeholder="xyz@gmail.com" required>
        <br> <br>
        <label for="number">Phone number:</label>
        <input type="number" id="number" name="number" required>
        <br> <br>
        <label for="dob">Date of birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br> <br>
        <label for="branch" placeholder="select your branch">Select your branch name</label>
        <select name="branch" id="branch" required>
            <option value="" disabled selected>Select your branch</option>
            <option value="CSE">Computer Science and Engineering (CSE)</option>
            <option value="ME">Mechanical Engineering (ME)</option>
            <option value="CE">Civil Engineering (CE)</option>
            <option value="EE">Electrical Engineering (EE)</option>
            <option value="ECE">Electronics and Communication Engineering (ECE)</option>
            
        </select>

        
        <br> <br>
        <label for="Year">Enter your year:</label>
        <br>
        <input type="radio" id="1st" name="Year" >
        <label for="1st">1st year</label>
        <br>
        <input type="radio"id="2nd" name="Year">
        <label for="2nd">2nd year</label>
        <br>
        <input type="radio"id="3rd" name="Year">
        <label for="3rd">3rd year</label>
        <br>
        <input type="radio"id="4th" name="Year">
        <label for="4th">4th year</label>
        <br> <br>
        
        <label for="events">Events to attend:</label>
        <br>
        <input type="checkbox" id="events" name="events" >
        <label for="events">Singing Competition</label>
        <br>
        <input type="checkbox" id="events" name="events" >
        <label for="events">Instrumental Performance Contest</label>
        <br>
        <input type="checkbox" id="events" name="events" >
        <label for="events">Battle of Bands</label>
        <br>
        <input type="checkbox" id="events" name="events" >
        <label for="events">Music Quiz Competition</label>
        <br> <br>
        <label for="about">How did yo hear about us:</label>
       
        <textarea name="about" id="about" placeholder="How did yo hear about us..." required></textarea>
        <br><br>
        <label for="submit">Click here:</label>
        <input type="submit" id="submit" name="submit">
        
        
    </form>
    
    
</body>
</html>
